# Tanuki Framework — Docker Compose
#
# Includes: app (PHP-FPM), nginx (reverse proxy), and a database service.
# Apache is intentionally excluded — .htaccess already covers shared
# hosting deployments where Apache is used instead of this stack.
#
# ── Choosing a database engine ──────────────────────────────────────────
# Two "db" service definitions are provided below: one for MySQL/MariaDB
# and one for PostgreSQL. Only ONE should be active at a time.
#   1. Keep the block matching your DB_DRIVER in .env, delete/comment the other.
#   2. Update DB_HOST=db in .env (the service name, not "localhost" — containers
#      reach each other by service name on the Docker network).

services:
  app:
    build: .
    container_name: tanuki_app
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-production}
    depends_on:
      - db
    networks:
      - tanuki

  nginx:
    image: nginx:alpine
    container_name: tanuki_nginx
    ports:
      - "8050:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - tanuki

  # ── Option A: MySQL / MariaDB (DB_DRIVER=mysql) ─────────────────────────
  db:
    image: mariadb:11
    container_name: tanuki_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-tanuki_db_db}
      MYSQL_USER: ${DB_USER:-tanuki}
      MYSQL_PASSWORD: ${DB_PASS:-tanuki}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - tanuki

  # ── Option B: PostgreSQL (DB_DRIVER=pgsql) ──────────────────────────────
  # Comment out the "db" block above and uncomment this one instead.
  #
  # db:
  #   image: postgres:16-alpine
  #   container_name: tanuki_db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: ${DB_NAME:-tanuki_db}
  #     POSTGRES_USER: ${DB_USER:-tanuki}
  #     POSTGRES_PASSWORD: ${DB_PASS:-tanuki}
  #   volumes:
  #     - db_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - tanuki

  # ── Optional: Redis ──────────────────────────────────────────────────
  # redis:
  #   image: redis:7-alpine
  #   container_name: tanuki_redis
  #   command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-tanuki}"]
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - tanuki

  # ── Optional: MongoDB ────────────────────────────────────────────────
  # mongo:
  #   image: mongo:7
  #   container_name: tanuki_mongo
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo_data:/data/db
  #   networks:
  #     - tanuki

networks:
  tanuki:
    driver: bridge

volumes:
  db_data:
  # mongo_data: